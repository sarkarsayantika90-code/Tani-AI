
name: Build Tani AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP
        run: |
          test -f Tani-AI-GitHub-Ready.zip
          echo "Tani AI ZIP found."

      - name: Extract Tani AI project
        run: |
          rm -rf tani-project
          mkdir tani-project
          unzip -q Tani-AI-GitHub-Ready.zip -d tani-project
          echo "Project extracted:"
          ls -la tani-project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tani-project/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Fix esbuild dependency
        working-directory: tani-project
        run: |
          npm pkg set devDependencies.esbuild="^0.28.2"

      - name: Install dependencies
        working-directory: tani-project
        run: |
          npm install --legacy-peer-deps

      - name: Install Capacitor
        working-directory: tani-project
        run: |
          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            --legacy-peer-deps

      - name: Build web app
        working-directory: tani-project
        run: npm run build:web

      - name: Create Android project
        working-directory: tani-project
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: tani-project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: tani-project/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tani-AI-debug-apk
          path: tani-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: tani-project
        run: npm install

      - name: Install Capacitor
        working-directory: tani-project
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build web app
        working-directory: tani-project
        run: npm run build:web

      - name: Create Android project
        working-directory: tani-project
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: tani-project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: tani-project/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tani-AI-debug-apk
          path: tani-project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
